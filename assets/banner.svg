<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1536" />
      <stop offset="100%" stop-color="#0d1b40" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3A7BD5" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0052CC" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14214d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0e1738" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2e68" stroke-width="0.7" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#00D2FF" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(6px) translateX(-4px); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beaconPulse {
        0% { r: 4; opacity: 1; }
        100% { r: 18; opacity: 0; }
      }
      .anim-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-float1 {
        animation: floatSlow1 5s ease-in-out infinite;
      }
      .anim-float2 {
        animation: floatSlow2 6.5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: dashAnim 12s linear infinite;
      }
      .beacon-ring {
        animation: beaconPulse 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .badge-pill {
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Ambient Nebula Lights in Background -->
  <g class="anim-pulse" opacity="0.4">
    <circle cx="200" cy="100" r="180" fill="#0052cc" filter="url(#glow)" opacity="0.25" />
    <circle cx="1000" cy="220" r="160" fill="#00D2FF" filter="url(#glow)" opacity="0.2" />
    <circle cx="600" cy="300" r="140" fill="#00ffa3" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Dynamic Animated Cyber / Network Connectors in Background -->
  <g opacity="0.45">
    <path class="stream-line" d="M 50 180 Q 300 80 600 180 T 1150 160" fill="none" stroke="#00D2FF" stroke-width="1.8" />
    <path class="stream-line" d="M 80 260 Q 400 320 750 220 T 1120 100" fill="none" stroke="#3A7BD5" stroke-width="1.2" stroke-dashoffset="60" />
    <path class="stream-line" d="M 150 60 Q 600 20 950 140" fill="none" stroke="#00FFA3" stroke-width="1" stroke-dashoffset="120" />
  </g>

  <!-- Left Dynamic Identity Shield / Vault Icon Graphic -->
  <g class="anim-float1" transform="translate(70, 75)">
    <!-- Rotating decorative radar ring -->
    <circle cx="65" cy="80" r="62" fill="none" stroke="#1f377d" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="65" cy="80" r="75" fill="none" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.25" />
    <circle class="beacon-ring" cx="65" cy="80" fill="none" stroke="#00D2FF" stroke-width="1.5" />

    <!-- Hex Shield Container -->
    <polygon points="65,20 120,48 120,112 65,140 10,112 10,48" fill="url(#cardGrad)" stroke="#00D2FF" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Okta Identity O-Ring Symbol & Lock/Cloud Emblem -->
    <circle cx="65" cy="74" r="28" fill="none" stroke="#00D2FF" stroke-width="5" filter="url(#glow)" opacity="0.8" />
    <circle cx="65" cy="74" r="28" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
    <!-- Recovery Arrow -->
    <path d="M 53 74 A 12 12 0 1 1 77 74" fill="none" stroke="#00FFA3" stroke-width="3" stroke-linecap="round" />
    <polygon points="73,66 79,74 85,66" fill="#00FFA3" />
    <circle cx="65" cy="74" r="3.5" fill="#00FFA3" />
    
    <text x="65" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8eaae8" letter-spacing="1.5">ZERO TRUST ID</text>
  </g>

  <!-- Right Dynamic Cards & Metrics Floating Badges -->
  <g class="anim-float2" transform="translate(940, 60)">
    <!-- Card 1: Backup Telemetry -->
    <rect x="0" y="0" width="190" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e3a7a" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="24" cy="24" r="7" fill="#00FFA3" fill-opacity="0.2" />
    <circle cx="24" cy="24" r="3.5" fill="#00FFA3" />
    <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Config Resilience</text>
    <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#00FFA3" font-weight="600">● 99.999% Point-in-Time</text>

    <!-- Card 2: Threat Detection & Recovery -->
    <rect x="15" y="86" width="185" height="68" rx="10" fill="url(#cardGrad)" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.7" filter="url(#cardShadow)" />
    <circle cx="38" cy="110" r="7" fill="#00D2FF" fill-opacity="0.2" />
    <circle cx="38" cy="110" r="3.5" fill="#00D2FF" />
    <text x="54" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">ITDR &amp; Anti-Drift</text>
    <text x="54" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#8eaae8" font-weight="500">AES-256 + Cross-Tenant</text>
  </g>

  <!-- Center Foreground Content: Guaranteed Clean Contrast & Layer Separation -->
  <g transform="translate(245, 75)">
    <!-- Category Pill Badge -->
    <g class="badge-pill">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#0c2356" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="14" r="4.5" fill="#00FFA3" />
      <text x="30" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#A5C7F7" letter-spacing="0.8">ENTERPRISE IDENTITY DATA PROTECTION</text>
    </g>

    <!-- Primary Title -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Okta Identity Cloud
    </text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Backup &amp; Disaster Recovery 🔐
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      Curated enterprise SaaS platforms, ITDR resilience, GitOps IaC state sync, and
    </text>
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      self-hosted open-source backup suites for Okta tenant configurations &amp; users.
    </text>

    <!-- Feature Attribute Micro-Pills -->
    <g transform="translate(0, 198)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="24" rx="6" fill="#13244d" stroke="#224082" stroke-width="1" />
      <text x="70" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8">🛡️ Zero Trust ITDR</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="155" height="24" rx="6" fill="#13244d" stroke="#224082" stroke-width="1" />
      <text x="227" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#34D399">⚡ Granular Restore</text>

      <!-- Pill 3 -->
      <rect x="315" y="0" width="145" height="24" rx="6" fill="#13244d" stroke="#224082" stroke-width="1" />
      <text x="387" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#F472B6">🔄 Cross-Tenant GitOps</text>

      <!-- Pill 4 -->
      <rect x="470" y="0" width="145" height="24" rx="6" fill="#13244d" stroke="#224082" stroke-width="1" />
      <text x="542" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#FBBF24">📦 Encrypted Snapshots</text>
    </g>
  </g>

  <!-- Bottom Accent Tech Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGrad)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0b1536"/><stop offset="100%" stop-color="#0d1b40"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00D2FF"/><stop offset="50%" stop-color="#3A7BD5"/><stop offset="100%" stop-color="#00FFA3"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00D2FF" stop-opacity=".8"/><stop offset="100%" stop-color="#0052CC" stop-opacity=".2"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#14214d" stop-opacity=".85"/><stop offset="100%" stop-color="#0e1738" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1d2e68" stroke-opacity=".35" stroke-width=".7" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#00D2FF" fill-opacity=".3"/></pattern><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatSlow1{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-8px) translateX(4px)}}@keyframes floatSlow2{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(6px) translateX(-4px)}}@keyframes dashAnim{0%{stroke-dashoffset:200}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes beaconPulse{0%{r:4;opacity:1}}.anim-pulse{animation:pulseGlow 6s ease-